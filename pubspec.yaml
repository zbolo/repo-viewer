name: forgejo_browser
description: A Flutter app for browsing Forgejo repositories and reviewing code
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for API calls
  http: ^1.1.0

  # Syntax highlighting for code viewer
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # Local storage for saving server URL and token
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
